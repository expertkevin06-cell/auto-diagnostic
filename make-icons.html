<!DOCTYPE html><html><head><title>Générateur icônes</title></head>
<body style="background:#111;color:#fff;font-family:sans-serif;padding:20px;text-align:center">
<h1>🎨 Génération des icônes PNG</h1>
<p>Cliquez sur chaque bouton : l'icône sera téléchargée sur votre appareil.</p>
<button onclick="make(192)" style="display:block;width:90%;margin:10px auto;padding:18px;font-size:17px;background:#4ade80;border:none;border-radius:10px;cursor:pointer">⬇️ Télécharger icon-192.png</button>
<button onclick="make(512)" style="display:block;width:90%;margin:10px auto;padding:18px;font-size:17px;background:#4ade80;border:none;border-radius:10px;cursor:pointer">⬇️ Télécharger icon-512.png</button>
<p style="color:#94a3b8;font-size:13px">Les fichiers arrivent dans vos Téléchargements.</p>
<script>
function make(size){
  const c = document.createElement('canvas'); c.width = size; c.height = size;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, size, size);
  g.addColorStop(0, '#0a0e27'); g.addColorStop(1, '#1a1f3a');
  x.fillStyle = g; x.fillRect(0, 0, size, size);
  x.fillStyle = '#4ade80';
  x.beginPath(); x.arc(size/2, size/2, size*0.38, 0, Math.PI*2); x.fill();
  x.fillStyle = '#0a0e27';
  x.font = 'bold ' + Math.floor(size*0.30) + 'px sans-serif';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText('AD', size/2, size/2 + size*0.02);
  const a = document.createElement('a');
  a.download = 'icon-' + size + '.png';
  a.href = c.toDataURL('image/png');
  a.click();
}
</script></body></html>
