async function init() {

  log('✅ ' + Object.keys(B).length + ' marques');

  log('✅ modèles (≈330)');
  for (const [bid, list] of Object.entries(MO)) await db.ref('data/motors/' + bid).set(list);
  log('✅ motorisations');
  for (let i = 0; i < ISSUES.length; i++) await db.ref('data/issues/iss_' + i).set({ brandId: ISSUES[i][0], model: ISSUES[i][1], title: ISSUES[i][2], detail: ISSUES[i][3], source: ISSUES[i][4] });
  log('✅ pannes/rappels');
  for (const [c, v] of Object.entries(DTC)) await db.ref('data/dtc/' + c).set({ code: c, description: v[0], cause: v[1], solution: v[2] });
  log('✅ DTC');
  await db.ref('data/version').set({ version: Date.now(), lastUpdate: new Date().toISOString(), updateIntervalDays: 15 });
  await db.ref('access/users').set({});
  log('\n🎉 TERMINÉ — supprimez init.html de GitHub !');
}
