async function run() {
  const existing = (await db.ref('data/models').once('value')).val() || {};
  const names = {}; Object.values(existing).forEach(m => { names[m.brandId + '|' + m.name.toLowerCase()] = 1; });
  let added = 0;
  for (let i = 0; i < NEW.length; i++) {
    const [bid, name, years, motors] = NEW[i];
    if (names[bid + '|' + name.toLowerCase()]) { log('⏭️ Déjà présent : ' + name); continue; }
    const id = 'y_' + bid + '_' + Date.now() + '_' + i;
    await db.ref('data/models/' + id).set({ brandId: bid, name: name, years: years });
    await db.ref('data/motors/' + id).set(motors.map(m => ({ name: m[0], fuel: m[1], power: m[2] })));
    added++; log('✅ Ajouté : ' + name);
  }
  log('✅ ' + added + ' modèles ajoutés');
  for (let i = 0; i < ISS.length; i++) {
    await db.ref('data/issues/m3_' + i).set({ brandId: ISS[i][0], model: ISS[i][1], motor: ISS[i][2], title: ISS[i][3], detail: ISS[i][4], source: ISS[i][5], dtc: ISS[i][6] });
  }
  log('✅ ' + ISS.length + ' pannes/rappels par marque (tous modèles)');
  await db.ref('data/version').set({ version: Date.now(), lastUpdate: new Date().toISOString(), updateIntervalDays: 30 });
  log('\n🎉 TERMINÉ — supprimez update3.html de GitHub !');
}
