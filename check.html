<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🩺 Contrôleur - Auto Diagnostic Pro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="screen active">
  <div class="container" style="max-width:800px">
    <h1>🩺 Contrôleur de vérification</h1>
    <p class="subtitle">Syntaxe des fichiers • Objets • DOM • Bases • Recherches</p>
    <div id="checkReport" class="card" style="font-family:monospace;font-size:13px;white-space:pre-wrap;min-height:200px">⏳ Vérifications en cours...</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button id="btnRerun" class="btn btn-primary" style="flex:1">🔄 Relancer</button>
      <a href="admin.html" class="btn btn-outline" style="flex:1;text-decoration:none">→ Admin</a>
      <a href="index.html" class="btn btn-outline" style="flex:1;text-decoration:none">→ Application</a>
    </div>
  </div>
</div>

<script>
// Capture toutes les erreurs JS avec numéro de ligne
window.__errors = [];
window.addEventListener('error', function (e) {
  window.__errors.push((e.message || 'Erreur') + ' — ligne ' + (e.lineno || '?') + ' dans ' + (e.filename || '').split('/').pop());
});
window.addEventListener('unhandledrejection', function (e) {
  window.__errors.push('Promesse rejetée: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
});
</script>
<script src="db.js"></script>
<script src="vehicles-db.js"></script>
<script src="dtc-db.js"></script>
<script src="recalls-db.js"></script>
<script src="ai-search.js"></script>

<script>
(function () {
  var out = [];
  function line(ok, txt) { out.push((ok ? '✅ ' : '❌ ') + txt); render(); }
  function render() { document.getElementById('checkReport').textContent = out.join('\n'); }
  document.getElementById('btnRerun').addEventListener('click', function () { location.reload(); });

  (async function () {
    var V = '?v=' + Date.now(); // anti-cache

    // ===== 1) VÉRIFICATION SYNTAXE DE CHAQUE FICHIER (ligne par ligne) =====
    out.push('─── 1) SYNTAXE DES FICHIERS ───'); render();
    var files = ['db.js', 'vehicles-db.js', 'dtc-db.js', 'recalls-db.js', 'ai-search.js', 'app.js', 'admin.js', 'sw.js'];
    for (var i = 0; i < files.length; i++) {
      var f = files[i];
      try {
        var resp = await fetch(f + V);
        if (!resp.ok) { line(false, f + ' : introuvable (HTTP ' + resp.status + ')'); continue; }
        var code = await resp.text();
        try {
          new Function(code); // analyse SANS exécuter
          line(true, f + ' : syntaxe OK (' + code.split('\n').length + ' lignes)');
        } catch (e) {
          line(false, f + ' : ERREUR DE SYNTAXE → ' + e.message + ' ⇒ REMPLACEZ CE FICHIER');
        }
      } catch (e) {
        line(false, f + ' : lecture impossible (' + e.message + ')');
      }
    }

    // ===== 2) OBJETS CHARGÉS =====
    out.push('\n─── 2) OBJETS EN MÉMOIRE ───'); render();
    ['DB', 'VEHICLES_DB', 'DTC_DB', 'RECALLS_DB', 'AI_SEARCH'].forEach(function (n) {
      line(typeof window[n] !== 'undefined', 'Objet ' + n + (typeof window[n] !== 'undefined' ? ' chargé' : ' MANQUANT'));
    });

    // ===== 3) ERREURS JS CAPTURÉES =====
    out.push('\n─── 3) ERREURS RUNTIME ───'); render();
    if (window.__errors.length === 0) line(true, 'Aucune erreur JavaScript capturée');
    else window.__errors.forEach(function (e) { line(false, 'ERREUR: ' + e); });

    // ===== 4) TESTS FONCTIONNELS BASES =====
    out.push('\n─── 4) BASES DE DONNÉES ───'); render();
    try {
      await DB.init();
      line(true, 'IndexedDB initialisé');
      var v = await DB.getAll('vehicles'); line(v.length > 0, 'Véhicules: ' + v.length);
      var d = await DB.getAll('dtcCodes'); line(d.length > 0, 'Codes DTC: ' + d.length);
      var r = await DB.getAll('recalls'); line(r.length > 0, 'Rappels: ' + r.length);
      var u = await DB.getAll('users'); line(true, 'Utilisateurs: ' + u.length);
    } catch (e) { line(false, 'Erreur base: ' + e.message); }

    // ===== 5) RECHERCHES CLÉS =====
    out.push('\n─── 5) RECHERCHES CLÉS ───'); render();
    try {
      var p1 = await DTC_DB.getByCode('P200E');
      line(!!p1, 'Code P200E: ' + (p1 ? 'TROUVÉ (' + p1.system + ')' : 'ABSENT'));
      var p2 = await DTC_DB.getByCode('P20EE');
      line(!!p2, 'Code P20EE: ' + (p2 ? 'TROUVÉ' : 'ABSENT'));
      var br = await VEHICLES_DB.getBrands('FRANCE');
      line(br.length > 0, 'Marques France: ' + br.join(', '));
      var br2 = await VEHICLES_DB.getBrands('EUROPE');
      line(br2.indexOf('Dacia') >= 0 && br2.indexOf('Skoda') >= 0, 'Marques Europe (Dacia, Skoda présents)');
    } catch (e) { line(false, 'Erreur recherche: ' + e.message); }

    out.push('\n─── RÉSULTAT ───');
    var nbKo = out.filter(function (l) { return l.indexOf('❌') === 0; }).length;
    line(nbKo === 0, nbKo === 0 ? 'TOUT EST CONFORME → utilisez Admin (Ctrl+F5)' : nbKo + ' anomalie(s) → corrigez les fichiers ❌ ci-dessus');
  })();
})();
</script>
</body>
</html>
